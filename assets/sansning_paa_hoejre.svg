  <polygon points="842,274 1152,258 1152,270 842,286" fill="#BD844D" class="ink"/>
  <!-- Brackets -->
  <polygon points="865,284 885,284 865,315" fill="#9E6A3B" class="ink-thin"/>
  <polygon points="1095,272 1115,272 1095,303" fill="#9E6A3B" class="ink-thin"/>
