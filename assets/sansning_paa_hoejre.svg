  <!-- Legs/shoes -->
  <path d="M268,672 L308,678 L314,768 L286,770 L282,695 L252,695 Z" fill="#6F8A9C" class="ink"/>
  <ellipse cx="305" cy="775" rx="16" ry="8" fill="#D4D8DC" class="ink"/>
  <path d="M235,682 L268,690 L268,775 L240,775 Z" fill="#5D788A" class="ink"/>
  <ellipse cx="258" cy="782" rx="16" ry="8" fill="#EAECEF" class="ink"/>
  <!-- Sweater torso -->
  <path d="M214,578 Q250,564 284,578 L294,666 Q250,676 210,664 Z" fill="#EFE4CC" class="ink"/>
  <path d="M217,604 L288,604 M214,625 L290,625 M212,644 L292,644" stroke="#9C7A54" stroke-width="3"/>
  <!-- Left & right arms resting comfortably -->
  <path d="M215,585 Q186,620 214,658 L228,648 Q208,622 224,598 Z" fill="#EFE4CC" class="ink"/>
  <circle cx="222" cy="656" r="10" fill="#F8CFB2" class="ink"/>
  <path d="M282,585 Q318,622 288,662 L272,652 Q292,625 274,598 Z" fill="#EFE4CC" class="ink"/>
  <circle cx="275" cy="660" r="10" fill="#F8CFB2" class="ink"/>
  <!-- Smiling Head -->
  <circle cx="248" cy="542" r="36" fill="#F8CFB2" class="ink"/>
  <path d="M214,536 Q220,498 258,504 Q286,510 282,542 Q265,522 240,528 Q224,524 214,536 Z" fill="#E3BC6B" class="ink"/>
  <circle cx="262" cy="542" r="3" fill="#2D221B"/>
  <circle cx="242" cy="542" r="3" fill="#2D221B"/>
  <path d="M244,557 Q254,565 264,556" fill="none" class="ink"/>

  <!-- HOTSPOT 3 (Center-bottom): CAT LYING ON TOP OF CLOSED BOX ("katten ligger på kassen") -->
  <!-- Closed Cardboard Box shifted clear of table legs (top flaps shut flat!) -->
  <polygon points="402,692 590,640 705,704 518,760" fill="#D5A872" class="ink"/>
  <!-- Flap seam line showing it is closed -->
