    <path d="M1095,210 Q1109,210 1109,224 Q1109,236 1095,236" fill="none" class="ink"/>
  </g>

  <!-- Kitchen counter below shelf -->
  <polygon points="880,388 1200,375 1200,420 880,432" fill="#ECC595" class="ink"/>
