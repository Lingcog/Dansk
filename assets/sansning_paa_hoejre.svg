    <polygon points="30,63 35,63 32,67" fill="#D66860"/>
  </g>

  <!-- Dining Table Right -->
  <polygon points="602,510 925,442 1165,525 842,608" fill="#DCA76F" class="ink"/>
  <polygon points="602,510 842,608 842,630 602,530" fill="#BA804B" class="ink"/>
  <polygon points="842,608 1165,525 1165,546 842,630" fill="#C98F58" class="ink"/>
