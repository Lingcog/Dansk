<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Udtale-tester (Sønderjysk Prototype)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #111827;
        }

        p {
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .status-box {
            background: #e5e7eb;
            color: #374151;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        button {
            background-color: #e67e22; /* Warm orange */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(230, 126, 34, 0.3);
            margin-bottom: 20px;
            touch-action: manipulation;
        }

        button:hover {
            background-color: #d35400;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.recording {
            background-color: #ef4444; /* Red when recording */
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .result-box {
            margin-top: 20px;
            text-align: left;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            background: #f9fafb;
            min-height: 100px;
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .result-text {
            font-size: 18px;
            color: #111827;
            white-space: pre-wrap;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Udtale-tester (Whisper)</h1>
        <p>Her kan vi teste, hvordan den "rå" Whisper-AI forstår din sønderjyske dialekt! <br>Al analyse sker 100 % lokalt i din browser (koster 0 kr.).</p>
        
        <div id="status" class="status-box">1. Downloader AI-model (vent venligst, ca. 40MB)...</div>

        <button id="recordBtn" disabled>Vent...</button>

        <div class="result-box">
            <div class="result-label">AI'en hørte dig sige:</div>
            <div id="resultText" class="result-text"><em>...</em></div>
        </div>
    </div>

    <!-- Importer Transformers.js -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';

        // Tving modellen til at køre i browseren uden server
        env.allowLocalModels = false; 

        const statusEl = document.getElementById('status');
        const recordBtn = document.getElementById('recordBtn');
        const resultText = document.getElementById('resultText');

        let transcriber = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // 1. Indlæs AI-modellen
        async function loadModel() {
            try {
                // Vi bruger 'Xenova/whisper-tiny', da den understøtter dansk og er lynhurtig (ca. 40MB).
                transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny');
                statusEl.textContent = '✅ AI-modellen er klar! Lokalt på din maskine.';
                statusEl.style.backgroundColor = '#d1fae5';
                statusEl.style.color = '#065f46';
                
                // Gør knappen klar
                recordBtn.textContent = 'Hold inde for at tale';
                recordBtn.disabled = false;
                setupAudio();
            } catch (err) {
                console.error(err);
                statusEl.textContent = '❌ Fejl under indlæsning af model. Tjek konsollen.';
                statusEl.style.backgroundColor = '#fee2e2';
                statusEl.style.color = '#991b1b';
            }
        }

        // 2. Sæt mikrofonen op
        async function setupAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    processAudio(audioBlob);
                };

                // Touch/Mouse events for knappen
                const startRecording = (e) => {
                    e.preventDefault(); // Undgå markering af tekst på mobil
                    if (mediaRecorder.state === 'inactive') {
                        mediaRecorder.start();
                        recordBtn.classList.add('recording');
                        recordBtn.textContent = 'Optager... (Slip for at stoppe)';
                        resultText.innerHTML = '<em>Lytter...</em>';
                    }
                };

                const stopRecording = (e) => {
                    e.preventDefault();
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        recordBtn.classList.remove('recording');
                        recordBtn.innerHTML = 'Analyserer... <div class="spinner"></div>';
                        recordBtn.disabled = true;
                    }
                };

                // Mouse events (Computer)
                recordBtn.addEventListener('mousedown', startRecording);
                window.addEventListener('mouseup', stopRecording); // Stop uanset hvor musen slippes
                
                // Touch events (Mobil)
                recordBtn.addEventListener('touchstart', startRecording);
                window.addEventListener('touchend', stopRecording);

            } catch (err) {
                console.error("Mikrofon adgang nægtet:", err);
                statusEl.textContent = '❌ Du skal tillade mikrofonadgang for at teste.';
            }
        }

        // 3. Behandl lyden og send til AI'en
        async function processAudio(blob) {
            try {
                // Vi skal konvertere lyden til et format, Whisper forstår (16kHz Float32Array)
                const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const audioData = audioBuffer.getChannelData(0); // Hent lydkanal 1

                // Kør modellen på lyddataen! (Vi tvinger sproget til dansk for at undgå at den gætter på engelsk)
                const output = await transcriber(audioData, {
                    language: 'danish',
                    task: 'transcribe'
                });

                // Vis resultatet
                resultText.innerHTML = `<strong>${output.text}</strong>`;
                
                // Nulstil knappen
                recordBtn.textContent = 'Hold inde for at tale';
                recordBtn.disabled = false;

            } catch (err) {
                console.error("Fejl under analyse:", err);
                resultText.innerHTML = `<em style="color:red;">Fejl: Kunne ikke analysere lyden.</em>`;
                recordBtn.textContent = 'Hold inde for at tale';
                recordBtn.disabled = false;
            }
        }

        // Start det hele
        loadModel();

    </script>
</body>
</html>
