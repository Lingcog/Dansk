  <g>
    <!-- Mug 1 -->
    <rect x="868" y="210" width="38" height="44" rx="4" fill="#F8FAFC" class="ink"/>
    <path d="M906,220 Q920,220 920,234 Q920,246 906,246" fill="none" class="ink"/>
    <!-- Mug 2 -->
    <rect x="928" y="206" width="40" height="45" rx="4" fill="#E2E8F0" class="ink"/>
