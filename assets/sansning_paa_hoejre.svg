<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF7EA"/>
      <stop offset="100%" stop-color="#F6E9CF"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D9AA"/>
      <stop offset="100%" stop-color="#E4BC82"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFF1FC"/>
      <stop offset="100%" stop-color="#FFF6D6"/>
    </linearGradient>
    <style>
      .ink { stroke: #2D221B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { stroke: #2D221B; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .wood { fill: #D9A36A; }
      .wood-dark { fill: #BC814B; }
      .wood-light { fill: #E9BC88; }
    </style>
  </defs>

  <!-- Back & Side Walls -->
  <rect x="0" y="0" width="1200" height="500" fill="url(#wallGrad)"/>
  <line x1="765" y1="0" x2="765" y2="495" class="ink-thin" opacity="0.5"/>

  <!-- Floor with plank lines -->
  <polygon points="0,500 1200,500 1200,900 0,900" fill="url(#floorGrad)" class="ink"/>
  <g stroke="#B88B58" stroke-width="1.5" opacity="0.65">
    <line x1="0" y1="560" x2="1200" y2="620"/>
    <line x1="0" y1="630" x2="1200" y2="700"/>
    <line x1="0" y1="710" x2="1200" y2="790"/>
    <line x1="0" y1="795" x2="1200" y2="885"/>
    <line x1="0" y1="880" x2="550" y2="900"/>
  </g>

  <!-- Rug under right dining table -->
  <polygon points="410,665 1130,635 1200,775 560,860" fill="#E9D7B8" class="ink"/>
  <polygon points="435,680 1110,652 1170,765 575,840" fill="none" stroke="#9C7B56" stroke-width="2" stroke-dasharray="10,7"/>

  <!-- Blue Rug under left table -->
  <polygon points="20,455 510,415 585,485 110,565" fill="#BBD0D9" class="ink"/>
  <polygon points="45,465 495,428 555,480 125,550" fill="none" stroke="#6E8E9E" stroke-width="2"/>

  <!-- Window Center-Back -->
  <rect x="480" y="25" width="225" height="275" fill="#FAF1DF" class="ink"/>
  <rect x="498" y="42" width="88" height="115" fill="url(#skyGrad)" class="ink-thin"/>
  <rect x="598" y="42" width="88" height="115" fill="url(#skyGrad)" class="ink-thin"/>
  <rect x="498" y="168" width="88" height="112" fill="url(#skyGrad)" class="ink-thin"/>
  <rect x="598" y="168" width="88" height="112" fill="url(#skyGrad)" class="ink-thin"/>
  <!-- Tree foliage outside -->
  <path d="M500,275 Q540,210 585,250 Q625,190 685,245 L685,280 L500,280 Z" fill="#C9D99B" opacity="0.75"/>
  <!-- Windowsill -->
  <rect x="466" y="298" width="254" height="16" rx="2" fill="#E6C08E" class="ink"/>

  <!-- Framed Picture on Left Wall -->
  <rect x="225" y="55" width="76" height="96" fill="#EADAC0" class="ink"/>
  <rect x="236" y="66" width="54" height="74" fill="#FAF6EE" class="ink-thin"/>
  <path d="M263,128 L263,82 M263,108 L248,96 M263,98 L277,88" stroke="#6B8E5B" stroke-width="2.5" fill="none"/>
  <ellipse cx="247" cy="95" rx="7" ry="4" fill="#8FB37C" class="ink-thin"/>
  <ellipse cx="277" cy="88" rx="7" ry="4" fill="#8FB37C" class="ink-thin"/>

