  <path d="M170,382 Q232,374 288,370" fill="none" stroke="#5E331A" stroke-width="2.5"/>
  <!-- Shiny brass KEYS lying clearly EXPOSED on wood tabletop -->
  <g transform="translate(325, 378)">
    <circle cx="14" cy="14" r="11" fill="none" stroke="#D49B27" stroke-width="4"/>
    <circle cx="14" cy="14" r="11" fill="none" stroke="#2D221B" stroke-width="1.5"/>
    <!-- Key 1 -->
    <ellipse cx="42" cy="8" rx="11" ry="8" fill="#F2C744" class="ink-thin"/>
    <rect x="52" y="5" width="48" height="7" rx="2" fill="#F2C744" class="ink-thin"/>
    <polygon points="84,12 96,12 96,22 89,22 89,17 84,17" fill="#F2C744" class="ink-thin"/>
    <!-- Key 2 -->
    <ellipse cx="36" cy="24" rx="10" ry="7" fill="#E0B130" class="ink-thin"/>
    <rect x="44" y="21" width="44" height="7" rx="2" fill="#E0B130" class="ink-thin"/>
    <polygon points="72,28 84,28 84,36 77,36" fill="#E0B130" class="ink-thin"/>
  </g>

