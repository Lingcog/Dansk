  <ellipse cx="905" cy="524" rx="82" ry="30" fill="#C98E58" class="ink"/>
  <ellipse cx="905" cy="520" rx="68" ry="22" fill="#DDA672" class="ink-thin"/>
  <!-- Bright Red Apples spread out ON the plate (no deep blue bowl!) -->
