  <rect x="822" y="625" width="24" height="225" class="wood-dark ink"/>
  <rect x="1122" y="544" width="22" height="215" class="wood-dark ink"/>
  <!-- Table Runner -->
  <polygon points="680,494 788,471 1020,548 912,576" fill="#F8F5EC" class="ink"/>

