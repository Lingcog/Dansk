  <!-- Closed wall cabinet above -->
  <rect x="850" y="35" width="240" height="145" fill="#D59A62" class="ink"/>
  <line x1="970" y1="35" x2="970" y2="180" class="ink"/>
  <circle cx="956" cy="112" r="4" fill="#4A3525"/>
  <circle cx="984" cy="112" r="4" fill="#4A3525"/>
