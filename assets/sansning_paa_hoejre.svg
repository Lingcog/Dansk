  <rect x="468" y="360" width="14" height="90" class="wood-dark ink"/>
  <rect x="692" y="346" width="14" height="92" class="wood-dark ink"/>
  <!-- Books on bench -->
  <rect x="595" y="318" width="84" height="14" rx="2" fill="#7D9871" class="ink"/>
  <rect x="602" y="305" width="76" height="13" rx="2" fill="#C97E63" class="ink"/>

  <!-- Potted Plant beside window -->
