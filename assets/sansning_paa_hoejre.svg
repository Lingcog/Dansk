    <circle cx="872" cy="508" r="21" fill="#D94136" class="ink"/>
    <path d="M872,487 Q876,478 880,476" fill="none" class="ink"/>
    <circle cx="910" cy="496" r="22" fill="#E34C40" class="ink"/>
