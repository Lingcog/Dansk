  <path d="M720,438 Q718,340 722,290" stroke="#537346" stroke-width="3" fill="none"/>
  <ellipse cx="702" cy="360" rx="18" ry="10" transform="rotate(-25 702 360)" fill="#88A96B" class="ink-thin"/>
  <ellipse cx="742" cy="340" rx="18" ry="10" transform="rotate(20 742 340)" fill="#77995B" class="ink-thin"/>
